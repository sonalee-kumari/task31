<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - Page Not Found | FreshWash Laundry">
  <title>404 - Page Not Found | FreshWash Laundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #38bdf8;
      --accent: #06b6d4;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e293b, #0f172a 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      overflow-x: hidden;
    }

    .error-container {
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      position: relative;
    }

    .bubble-animation {
      font-size: 4.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: floatBubble 3s ease-in-out infinite;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #f43f5e, #fb7185, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2.2rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      font-size: 1.05rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 8px 24px -6px rgba(2, 132, 199, 0.5);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(2, 132, 199, 0.7);
    }

    .missing-sock-tip {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="bubble-animation">🫧 🧦</div>
    <div class="error-code">404</div>
    <h1>Lost in the Spin Cycle!</h1>
    <p>We searched every washer, dryer, and laundry basket, but the URL you requested could not be found on our server.</p>
    
    <a href="/home" class="btn" id="btn-return-home">
      <span>⬅️</span> Return to Safe Ground (Home)
    </a>

    <div class="missing-sock-tip">
      Tip: Like that missing left sock, broken URLs happen! Check the web address or navigate using the button above.
    </div>
  </div>

</body>
</html>
